<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio-1</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }
        form {
            max-width: 400px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        label {
            display: block;
            margin-bottom: 8px;
        }
        input[type="text"], input[type="email"], input[type="number"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        input[type="radio"], input[type="checkbox"] {
            margin-right: 10px;
        }
        input[type="submit"] {
            background-color: #4caf50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center;">Formulario de Registro de Usuario</h1>
    <form action="procesar_registro.php" method="post">
        <!--Nombre-->
        <label for="nombre">Nombre Completo:</label>
        <input type="text" id="nombre" name="nombre" required minlength="3" placeholder="Introduce tu nombre Completo">
        <!--Correo electrónico-->
        <label for="email">Correo Electrónico:</label>
        <input type="email" id="email" name="email" required placeholder="Introduce tu correo electrónico">
        <!--Edad-->
        <label for="edad">Edad:</label>
        <input type="number" id="edad" name="edad" required min="18" placeholder="Introduce tu edad">
        <!--Género-->
        <fieldset>
            <legend>Género:</legend>
            <label for="masculino">
                <input type="radio" id="masculino" name="genero" value="masculino" required> Masculino
            </label>
            <label for="femenino">
                <input type="radio" id="femenino" name="genero" value="femenino" required> Femenino
            </label>
            <label for="otro">
                <input type="radio" id="otro" name="genero" value="otro" required> Otro
            </label>
        </fieldset>
        <!--Aceptación de términos-->
        <label for="terminos">
            <input type="checkbox" id="terminos" name="terminos" required> Acepto los <a href="#">términos y condiciones</a>
        </label>
        <!--Botón de enviar-->
        <input type="submit" value="Registrar">
    </form>
</body>
</html>
