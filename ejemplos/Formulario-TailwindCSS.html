<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Código que permite usar Tailwind CSS-->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Formulario Tailwind CSS</title>
</head>
<!--
    font-sans -> font-family
    bg-slate-100 -> background-color
    p-5 -> padding
-->
<body class="font-sans bg-slate-100 p-5">
    <!--
        text-center -> text-aling
        font-bold -> font-weight
        text-4xl -> font-size
        mb-5 -> margin-bottom
    -->
    <h1 class="text-center font-bold text-4xl mb-5">Formulario de Registro de Usuario</h1>
    <!--
        max-w-md -> max-width
        m-auto -> margin
        bg-white -> background-color
        p-5 -> padding
        rounded-lg -> border-radius
        shadow-sm -> box-shadow
    -->
    <form class="max-w-md m-auto bg-white p-5 rounded-lg shadow-sm" action="procesar_registro.php" method="post">
        <!--Nombre-->
        <!--
            block -> display
            mb-2 -> margin-bottom
        -->
        <label class="block mb-2" for="nombre">Nombre Completo:</label>
        <!--
            w-full -> width
            p-2 -> padding
            mb-2 -> margin-bottom
            border -> border-width
            border-gray-200 -> border-color
            rounded -> border-radius
        -->
        <input class="w-full p-2 mb-2 border border-gray-200 rounded" type="text" id="nombre" name="nombre" required minlength="3" placeholder="Introduce tu nombre Completo">
        <!--Correo electrónico-->
        <label class="block mb-2" for="email">Correo Electrónico:</label>
        <input class="w-full p-2 mb-2 border border-gray-200 rounded" type="email" id="email" name="email" required placeholder="Introduce tu correo electrónico">
        <!--Edad-->
        <label class="block mb-2" for="edad">Edad:</label>
        <input class="w-full p-2 mb-2 border border-gray-200 rounded" type="number" id="edad" name="edad" required min="18" placeholder="Introduce tu edad">
        <!--Género-->
        <fieldset class="">
            <legend>Género:</legend>
            <label class="block mb-2" for="masculino">
                <!--
                    mr-2 -> margin-right
                -->
                <input class="mr-2" type="radio" id="masculino" name="genero" value="masculino" required> Masculino
            </label>
            <label class="block mb-2" for="femenino">
                <input class="mr-2" type="radio" id="femenino" name="genero" value="femenino" required> Femenino
            </label>
            <label class="block mb-2" for="otro">
                <input class="mr-2" type="radio" id="otro" name="genero" value="otro" required> Otro
            </label>
        </fieldset>
        <!--Aceptación de términos-->
        <label class="block mb-2" for="terminos">
            <!--
                text-blue-800 -> color
                underline -> text-decoration-line
            -->
            <input class="mr-2" type="checkbox" id="terminos" name="terminos" required> Acepto los <a href="#" class="text-blue-800 underline">términos y condiciones</a>
        </label>
        <!--Botón de enviar-->
        <!--
            bg-green-400 -> background-color
            text-white -> color
            py -> padding-top padding-bottom
            px -> padding-left padding right
            border-none -> border-style
            rounded -> border-radius
            cursor-pointer -> cursor
            w-full -> width
        -->
        <input class="bg-green-400 text-white py-2 px-5 border-none rounded cursor-pointer w-full" type="submit" value="Registrar">
    </form>
</body>
</html>
